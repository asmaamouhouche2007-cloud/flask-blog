{% extends 'base.html' %}

{% block title %}{{ post['title'] }}{% endblock %}

{% block content %}
    <div class="card mt-4">
        <div class="card-body">
            <h2 class="card-title">{{ post['title'] }}</h2>
            <p class="card-text">{{ post['content'] }}</p>
            <small class="text-muted">Posted on: {{ post['created'] }}</small>
        </div>
    </div>
{% endblock %}
